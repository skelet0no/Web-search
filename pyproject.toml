[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemap-crawler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pymongo>=4.13,<5", "PyYAML>=6,<7", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "mongomock>=4.3,<5"]

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
