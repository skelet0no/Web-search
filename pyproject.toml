[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemap-crawler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28", "pymongo>=4.13", "PyYAML>=6", "defusedxml>=0.7"]

[tool.setuptools.packages.find]
include = ["crawler*"]

