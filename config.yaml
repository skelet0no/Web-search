db:
  uri: mongodb://mongo:27017
  database: crawler
logic:
  target_documents: 1000000
  recrawl_interval_days: 7
  request_timeout_seconds: 30
  max_retries: 5
  retry_base_seconds: 30
  lease_seconds: 300
  max_html_bytes: 8000000
  max_sitemap_bytes: 100000000
  poll_seconds: 5
  user_agent: SitemapCrawler/0.1
sources:
  - name: igromania
    domain: www.igromania.ru
    sitemap_urls: [https://www.igromania.ru/sitemap.xml]
    delay_seconds: 0.1
    concurrency: 5
  - name: stopgame
    domain: stopgame.ru
    sitemap_urls: [https://stopgame.ru/sitemap.xml]
    delay_seconds: 0.1
    concurrency: 5
  - name: vgtimes
    domain: vgtimes.ru
    sitemap_urls: [https://vgtimes.ru/sitemap.xml]
    delay_seconds: 0.1
    concurrency: 5
