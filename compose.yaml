services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  crawler:
    image: web-search-crawler
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    stop_grace_period: 2m
volumes:
  mongo_data:
