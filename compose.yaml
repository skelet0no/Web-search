services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  crawler:
    image: web-search-crawler
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    stop_grace_period: 2m
  corpus:
    image: web-search-crawler
    build: .
    profiles: [analysis]
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: [python, -m, corpus]
    command: [extract, /app/config.yaml, --output, /app/docx/runs]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docx:/app/docx
  tokenizer:
    image: web-search-tokenizer
    build:
      context: .
      dockerfile: tokenizer/Dockerfile
    profiles: [analysis]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/?serverSelectionTimeoutMS=10000
    volumes:
      - ./docx:/app/docx
    stop_grace_period: 2m
  lemmatizer:
    image: web-search-lemmatizer
    build:
      context: .
      dockerfile: lemmatizer/Dockerfile
    profiles: [analysis]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/?serverSelectionTimeoutMS=10000
    volumes:
      - ./docx:/app/docx
    stop_grace_period: 2m
  zipf:
    image: web-search-zipf
    user: "${ZIPF_UID:-1000}:${ZIPF_GID:-1000}"
    build:
      context: .
      dockerfile: zipf/Dockerfile
    profiles: [analysis]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/?serverSelectionTimeoutMS=10000
    volumes:
      - ./docx:/app/docx
    stop_grace_period: 2m
  boolean-index:
    image: web-search-boolean
    user: "${BOOLEAN_UID:-1000}:${BOOLEAN_GID:-1000}"
    build:
      context: .
      dockerfile: boolean/Dockerfile
    profiles: [analysis]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/?serverSelectionTimeoutMS=10000
    command: [--help]
    volumes:
      - ./indexes:/app/indexes
    stop_grace_period: 2m
  boolean-search:
    image: web-search-boolean
    user: "${BOOLEAN_UID:-1000}:${BOOLEAN_GID:-1000}"
    build:
      context: .
      dockerfile: boolean/Dockerfile
    profiles: [analysis]
    entrypoint: [/opt/web-search/bin/boolean-search, --dictionary, /opt/web-search/share/web-search/dictionary]
    command: [--help]
    volumes:
      - ./indexes:/app/indexes:ro
    stop_grace_period: 2m
volumes:
  mongo_data:
