services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  crawler:
    image: web-search-crawler
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    stop_grace_period: 2m
  corpus:
    image: web-search-crawler
    build: .
    profiles: [analysis]
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: [python, -m, corpus]
    command: [extract, /app/config.yaml, --output, /app/docx/runs]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./docx:/app/docx
  tokenizer:
    image: web-search-tokenizer
    build:
      context: .
      dockerfile: tokenizer/Dockerfile
    profiles: [analysis]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/?serverSelectionTimeoutMS=10000
    volumes:
      - ./docx:/app/docx
    stop_grace_period: 2m
volumes:
  mongo_data:
